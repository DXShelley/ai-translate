<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Translate</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="popup-header">
        <h1>AI Translate</h1>
        <p>查词与翻译</p>
      </header>

      <form id="wordSearchForm" class="word-search">
        <label class="sr-only" for="wordSearchInput">输入英文单词或中文文本</label>
        <input id="wordSearchInput" type="search" autocomplete="off" spellcheck="false" placeholder="输入英文单词或中文文本" maxlength="100" autofocus>
        <button class="search-button" type="submit" aria-label="查询" title="查询">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        </button>
      </form>

      <section id="wordResult" class="word-result" aria-live="polite" hidden></section>

      <button id="openOptions" class="options-button" type="button">打开完整配置页</button>
    </main>
    <script src="browser-adapter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
